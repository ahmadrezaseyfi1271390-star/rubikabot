<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Messages</title>
<style>
  body { font-family: sans-serif; direction: rtl; padding: 20px; }
  .message { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .message h3 { margin: 0 0 6px; }
  .message p { margin: 0 0 8px; }
  .message a { color: #0066cc; }
  .message small { color: #888; }
</style>
</head>
<body>
<div id="app"></div>
<script>
  const messages = [
    { "id": "1", "title": "تیتر پیام", "text": "متن پیام", "link": "https://example.com", "date": "1405/08/30" }
  ];

  const container = document.getElementById('app');
  messages.forEach(m => {
    const div = document.createElement('div');
    div.className = 'message';
    div.innerHTML = `
      <h3>${m.title}</h3>
      <p>${m.text}</p>
      <a href="${m.link}" target="_blank" rel="noopener">${m.link}</a><br>
      <small>${m.date}</small>
    `;
    container.appendChild(div);
  });
</script>
</body>
</html>
